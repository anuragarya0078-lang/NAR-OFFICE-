
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NAR OFFICE</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#101827;font-family:Arial,sans-serif;color:white}
canvas{display:block}
#top{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;z-index:5;pointer-events:none}
.pill{background:#101827dd;border:1px solid #526078;border-radius:12px;padding:10px 13px;font-size:13px}
#help{position:fixed;top:60px;left:12px;background:#101827cc;padding:8px 10px;border-radius:9px;font-size:11px;color:#dce6f7;z-index:5}
#controls{position:fixed;bottom:18px;left:15px;right:15px;display:flex;justify-content:space-between;align-items:end;z-index:8;pointer-events:none}
#stick{width:116px;height:116px;border-radius:50%;background:#ffffff22;border:2px solid #ffffff66;position:relative;pointer-events:auto;touch-action:none}
#knob{width:48px;height:48px;border-radius:50%;background:#e6edf8cc;position:absolute;left:32px;top:32px}
#actions{display:flex;flex-direction:column;gap:9px;align-items:end;pointer-events:auto}
button{border:1px solid #ffffff55;border-radius:13px;padding:13px 16px;background:#172943eF;color:white;font-weight:bold;font-size:14px}
button:active{background:#2767a8}
#voice{background:#087d75}
#panel{position:fixed;bottom:155px;left:12px;right:12px;max-width:480px;margin:auto;background:#101827ee;border:1px solid #71819b;border-radius:16px;padding:14px;z-index:9;display:none}
#panel h3{margin:0 0 8px}
#reply{font-size:13px;line-height:1.5;color:#e0e9f8;max-height:110px;overflow:auto}
#status{font-size:12px;color:#80e6d2;margin-top:8px}
#close{float:right;padding:5px 10px}
#message{width:100%;padding:12px;border-radius:9px;border:1px solid #65748c;background:#0d1728;color:white;margin-top:10px}
#send{margin-top:8px;background:#1769a8}
</style>
</head>
<body>
<div id="top">
 <div class="pill"><b>NAR OFFICE</b><br><span id="area">CEO OFFICE</span></div>
 <div class="pill">CEO: <b>You</b><br>AI TEAM: 5</div>
</div>
<div id="help">Joystick se chalo • Employee ke paas jaakar INTERACT dabao</div>

<div id="panel">
 <button id="close">✕</button>
 <h3 id="person">AI Employee</h3>
 <div id="reply">Namaste Boss! Main aapki help ke liye ready hoon.</div>
 <div id="status">Voice assistant ready</div>
 <input id="message" placeholder="Yahan message likho..." />
 <button id="send">SEND MESSAGE</button>
</div>

<div id="controls">
 <div id="stick"><div id="knob"></div></div>
 <div id="actions">
  <button id="interact">INTERACT</button>
  <button id="voice">🎙 VOICE COMMAND</button>
 </div>
</div>

<script type="importmap">
{
 "imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
 }
}
</script>
<script type="module">
import * as THREE from "three";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9bb8cf);
scene.fog = new THREE.Fog(0x9bb8cf, 25, 65);

const camera = new THREE.PerspectiveCamera(65,innerWidth/innerHeight,0.1,100);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xeaf5ff,0x526070,2));
const sun=new THREE.DirectionalLight(0xffffff,2.3);
sun.position.set(-8,15,10);
sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);
scene.add(sun);

const mat=(color,roughness=.75,metalness=0)=>new THREE.MeshStandardMaterial({color,roughness,metalness});
const floorMat=mat(0x697b8a);
const wallMat=mat(0xdce5e9);
const dark=mat(0x172334);
const wood=mat(0x79563c);
const glass=new THREE.MeshStandardMaterial({color:0x8bd5e5,transparent:true,opacity:.22,roughness:.15});
const blue=mat(0x1765b0);
const skin=mat(0xc98e68);
const black=mat(0x17202b);
const gold=mat(0xc99b38,.35,.6);
const white=mat(0xf1f3f5);
const screenMat=mat(0x142e45,.25,.2);

function cube(x,y,z,sx,sy,sz,material,cast=true){
 const m=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),material);
 m.position.set(x,y,z);m.castShadow=cast;m.receiveShadow=true;scene.add(m);return m;
}
function cylinder(x,y,z,r1,r2,h,material){
 const m=new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,20),material);
 m.position.set(x,y,z);m.castShadow=true;scene.add(m);return m;
}

// Floor and office structure
cube(0,-.25,0,30,.5,24,floorMat);
cube(0,4,-12,30,8,.3,wallMat);
cube(-15,4,0,.3,8,24,wallMat);
cube(15,4,0,.3,8,24,wallMat);
cube(0,4,12,30,8,.3,wallMat);

// Glass partitions
for(const x of [-9,-3,3,9]){
 cube(x,1.8,-2,.12,3.6,10,glass,false);
 cube(x,3.65,-2,.15,.12,10,dark);
}
for(const z of [-7,3]){
 cube(0,1.8,z,30,.12,.12,dark);
}

// Room signs
function sign(text,x,z){
 const c=document.createElement("canvas");
 c.width=512;c.height=128;
 const ctx=c.getContext("2d");
 ctx.fillStyle="#10233a";ctx.fillRect(0,0,512,128);
 ctx.fillStyle="#ffffff";ctx.font="bold 42px Arial";
 ctx.textAlign="center";ctx.fillText(text,256,80);
 const tex=new THREE.CanvasTexture(c);
 const mesh=new THREE.Mesh(new THREE.PlaneGeometry(3.4,.85),new THREE.MeshBasicMaterial({map:tex}));
 mesh.position.set(x,3.3,z);scene.add(mesh);
}
sign("CEO CABIN",-11,-11.75);
sign("AI MANAGER",-5,-11.75);
sign("DEVELOPER",1,-11.75);
sign("MARKETING",7,-11.75);
sign("ACCOUNTS",12,-11.75);
sign("MEETING ROOM",0,11.75);

// Windows
for(let x=-12;x<=12;x+=4){
 cube(x,2.5,-11.78,2.5,2,.08,glass,false);
}

// Furniture helper
function desk(x,z){
 cube(x,.85,z,2.8,.18,1.25,wood);
 for(const dx of [-1.2,1.2])for(const dz of [-.45,.45])
  cube(x+dx,.4,z+dz,.12,.8,.12,dark);
 cube(x,.98,z-.3,.95,.55,.07,dark);
 cube(x,1,z-.25,.82,.42,.025,screenMat,false);
 cube(x,1.12,z+.25,.55,.04,.35,black);
}
function chair(x,z){
 cylinder(x,.55,z,.38,.38,.15,black);
 cylinder(x,1,z+.3,.08,.08,.8,black);
 cube(x,1.2,z+.58,.65,.7,.13,blue);
}
const deskPositions=[[-5,-8],[1,-8],[7,-8],[12,-8],[-1,7]];
for(const [x,z] of deskPositions){desk(x,z);chair(x,z+1.3);}

// CEO desk and chair
desk(-11,-8.5);
cube(-11,1.25,-8.1,1.1,.15,.5,gold);
chair(-11,-6.8);
cube(-11,2,-10.5,2.5,2,.15,dark);
cube(-11,2,-10.38,2.25,1.75,.03,gold);

// Ceiling lights
for(let x=-10;x<=10;x+=5){
 const light=new THREE.PointLight(0xffffff,45,12);
 light.position.set(x,6,0);scene.add(light);
 cube(x,7,0,2.5,.08,.5,white,false);
}

// Plants
function plant(x,z){
 cylinder(x,.5,z,.45,.55,1,mat(0x79513a));
 for(let i=0;i<5;i++){
  const leaf=new THREE.Mesh(new THREE.ConeGeometry(.18,1.4,8),mat(0x28734a));
  leaf.position.set(x+Math.sin(i*1.25)*.3,1.35,z+Math.cos(i*1.25)*.3);
  leaf.rotation.z=Math.sin(i)*.35;scene.add(leaf);
 }
}
plant(-14,-10);plant(14,-10);plant(-14,9);plant(14,9);

// Humanoid character creator
function human(name,role,x,z,isBoss=false){
 const group=new THREE.Group();
 const shirt=isBoss?black:blue;
 const pants=isBoss?black:dark;
 const skinMat=skin;
 function part(geo,material,px,py,pz,sx=1,sy=1,sz=1){
  const m=new THREE.Mesh(geo,material);
  m.position.set(px,py,pz);m.scale.set(sx,sy,sz);
  m.castShadow=true;group.add(m);return m;
 }
 // Legs
 part(new THREE.BoxGeometry(.28,.85,.3),pants,-.19,.55,0);
 part(new THREE.BoxGeometry(.28,.85,.3),pants,.19,.55,0);
 // Shoes
 part(new THREE.BoxGeometry(.34,.18,.48),black,-.19,.12,.07);
 part(new THREE.BoxGeometry(.34,.18,.48),black,.19,.12,.07);
 // Body
 part(new THREE.BoxGeometry(.85,1.05,.42),shirt,0,1.55,0);
 // Boss jacket details
 if(isBoss){
  part(new THREE.BoxGeometry(.07,.85,.025),gold,0,1.55,.22);
  part(new THREE.BoxGeometry(.2,.35,.035),gold,0,1.9,.24);
 }else{
  part(new THREE.BoxGeometry(.22,.12,.035),white,0,1.85,.23);
 }
 // Arms
 for(const side of [-1,1]){
  const arm=part(new THREE.CapsuleGeometry(.12,.58,4,8),shirt,side*.53,1.55,0);
  arm.rotation.z=side*.12;
  part(new THREE.SphereGeometry(.14,12,12),skinMat,side*.56,1.12,.02);
 }
 // Neck and head
 part(new THREE.CylinderGeometry(.13,.13,.22,12),skinMat,0,2.15,0);
 part(new THREE.SphereGeometry(.34,24,20),skinMat,0,2.52,0,.95,1.12,.9);
 // Hair
 part(new THREE.SphereGeometry(.35,20,12),black,0,2.73,-.035,1, .55,1);
 // Eyes
 for(const side of [-1,1]){
  part(new THREE.SphereGeometry(.045,10,10),white,side*.12,2.56,.29);
  part(new THREE.SphereGeometry(.022,8,8),dark,side*.12,2.56,.33);
 }
 if(isBoss){
  part(new THREE.BoxGeometry(.6,.09,.07),gold,0,2.15,.2);
 }
 group.position.set(x,0,z);
 group.userData={name,role,isBoss};
 scene.add(group);
 return group;
}

// Five workers, identical blue uniform; separate CEO boss character
const employees=[
 human("AI Manager","MANAGER",-5,-6.2),
 human("AI Developer","DEVELOPER",1,-6.2),
 human("AI Marketing","MARKETING",7,-6.2),
 human("AI Accountant","ACCOUNTANT",12,-6.2),
 human("AI Secretary","SECRETARY",-1,5.2)
];
const boss=human("CEO Boss","CEO",-11,-5.7,true);

// Floating labels
function label(text,obj){
 const c=document.createElement("canvas");c.width=512;c.height=100;
 const ctx=c.getContext("2d");
 ctx.fillStyle="#10233a";ctx.fillRect(0,0,512,100);
 ctx.fillStyle="#ffffff";ctx.font="bold 35px Arial";ctx.textAlign="center";
 ctx.fillText(text,256,65);
 const texture=new THREE.CanvasTexture(c);
 const sprite=new THREE.Sprite(new THREE.SpriteMaterial({map:texture,transparent:true}));
 sprite.scale.set(2.4,.48,1);sprite.position.set(0,3.5,0);obj.add(sprite);
}
employees.forEach(e=>label(e.userData.name,e));
label("YOU - CEO",boss);

// Player movement
let moveX=0,moveZ=0;
const stick=document.getElementById("stick");
const knob=document.getElementById("knob");
let activePointer=null;
stick.addEventListener("pointerdown",e=>{
 activePointer=e.pointerId;stick.setPointerCapture(e.pointerId);updateStick(e);
});
stick.addEventListener("pointermove",e=>{if(e.pointerId===activePointer)updateStick(e)});
function updateStick(e){
 const r=stick.getBoundingClientRect();
 let dx=e.clientX-(r.left+r.width/2);
 let dy=e.clientY-(r.top+r.height/2);
 const len=Math.hypot(dx,dy),max=36;
 if(len>max){dx=dx/len*max;dy=dy/len*max}
 knob.style.left=(32+dx)+"px";knob.style.top=(32+dy)+"px";
 moveX=dx/max;moveZ=dy/max;
}
function stopStick(){
 activePointer=null;moveX=0;moveZ=0;
 knob.style.left="32px";knob.style.top="32px";
}
stick.addEventListener("pointerup",stopStick);
stick.addEventListener("pointercancel",stopStick);

// Keyboard support
const keys={};
addEventListener("keydown",e=>keys[e.key.toLowerCase()]=true);
addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);

// Employee selection and interaction
let selected=null;
const panel=document.getElementById("panel");
const reply=document.getElementById("reply");
const status=document.getElementById("status");
const person=document.getElementById("person");
const message=document.getElementById("message");

function nearestEmployee(){
 let best=null,dist=999;
 for(const e of employees){
  const d=boss.position.distanceTo(e.position);
  if(d<dist){dist=d;best=e}
 }
 return dist<4?best:null;
}
function openEmployee(e){
 if(!e){
  status.textContent="Employee ke paas jao, phir INTERACT dabao.";
  return;
 }
 selected=e;
 person.textContent=e.userData.name+" • "+e.userData.role;
 reply.textContent="Namaste Boss! Main "+e.userData.role+" hoon. Aap mujhse Hindi, English ya Hinglish mein baat kar sakte hain.";
 status.textContent="Employee connected";
 panel.style.display="block";
 speak("Namaste Boss. Main "+e.userData.name+" hoon. Bataiye, main aapki kya help kar sakta hoon?");
}
document.getElementById("interact").onclick=()=>openEmployee(nearestEmployee());
document.getElementById("close").onclick=()=>panel.style.display="none";

// Demo responses. Real tasks require a secure Gemini backend.
function answerFor(role,text){
 const q=text.toLowerCase();
 if(q.includes("hello")||q.includes("namaste")||q.includes("hi"))
  return "Namaste Boss! Main kaam ke liye ready hoon.";
 if(role==="MANAGER")
  return "Boss, main team ke tasks coordinate kar sakta hoon. Aap mujhe task assign kijiye. Abhi yeh demo assistant hai.";
 if(role==="DEVELOPER")
  return "Boss, main website development mein help kar sakta hoon. Website ka naam, features aur design bataiye. Real coding task ke liye Gemini backend connect karna hoga.";
 if(role==="MARKETING")
  return "Boss, main marketing ideas, client outreach messages aur business promotion plans banane mein help kar sakta hoon.";
 if(role==="ACCOUNTANT")
  return "Boss, main income, expenses, advance payment aur pending payment ka record plan karne mein help kar sakta hoon.";
 if(role==="SECRETARY")
  return "Boss, main meeting schedule, reminders aur email drafts banane mein help kar sakta hoon.";
 return "Boss, aapka message mil gaya. Bataiye aur kya karna hai?";
}
function sendMessage(text){
 if(!selected){openEmployee(nearestEmployee());if(!selected)return}
 if(!text.trim())return;
 const response=answerFor(selected.userData.role,text);
 reply.textContent="You: "+text+"\n\n"+selected.userData.name+": "+response;
 status.textContent="Demo response";
 speak(response);
 message.value="";
}
document.getElementById("send").onclick=()=>sendMessage(message.value);
message.addEventListener("keydown",e=>{if(e.key==="Enter")sendMessage(message.value)});

// Voice reply
function speak(text){
 if(!("speechSynthesis" in window)){
  status.textContent="Is browser mein voice reply supported nahi hai.";return;
 }
 speechSynthesis.cancel();
 const utter=new SpeechSynthesisUtterance(text);
 utter.lang="hi-IN";
 utter.rate=.95;utter.pitch=1;
 speechSynthesis.speak(utter);
}

// Voice input
document.getElementById("voice").onclick=()=>{
 const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SpeechRecognition){
  status.textContent="Voice input supported nahi. Android Chrome mein site kholo.";
  return;
 }
 if(!selected)openEmployee(nearestEmployee());
 if(!selected){
  status.textContent="Pehle employee ke paas jaakar INTERACT dabao.";
  return;
 }
 const recognition=new SpeechRecognition();
 recognition.lang="hi-IN";
 recognition.continuous=false;
 recognition.interimResults=false;
 status.textContent="🎙 Sun raha hoon... Ab boliye.";
 recognition.onresult=e=>{
  const text=e.results[0][0].transcript;
  status.textContent="Aapne kaha: "+text;
  sendMessage(text);
 };
 recognition.onerror=e=>status.textContent="Mic error: "+e.error+". Microphone permission check karein.";
 recognition.onend=()=>{};
 recognition.start();
};

// Tap an employee to select
const raycaster=new THREE.Raycaster();
const pointer=new THREE.Vector2();
renderer.domElement.addEventListener("pointerdown",e=>{
 if(e.target.closest && e.target.closest("button"))return;
 pointer.x=(e.clientX/innerWidth)*2-1;
 pointer.y=-(e.clientY/innerHeight)*2+1;
 raycaster.setFromCamera(pointer,camera);
 const hits=raycaster.intersectObjects(employees,true);
 if(hits.length){
  let o=hits[0].object;
  while(o.parent&&!o.userData.name)o=o.parent;
  if(o.userData.name)openEmployee(o);
 }
});

// Camera and animation
const clock=new THREE.Clock();
function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.05);
 let x=moveX,z=moveZ;
 if(keys["w"]||keys["arrowup"])z-=1;
 if(keys["s"]||keys["arrowdown"])z+=1;
 if(keys["a"]||keys["arrowleft"])x-=1;
 if(keys["d"]||keys["arrowright"])x+=1;
 const length=Math.hypot(x,z);
 if(length>1){x/=length;z/=length}
 boss.position.x+=x*dt*4;
 boss.position.z+=z*dt*4;
 boss.position.x=THREE.MathUtils.clamp(boss.position.x,-13.5,13.5);
 boss.position.z=THREE.MathUtils.clamp(boss.position.z,-10.5,10.5);
 if(length>.05)boss.rotation.y=Math.atan2(x,z);
 const target=new THREE.Vector3(boss.position.x,2,boss.position.z+6.5);
 camera.position.lerp(target,.09);
 camera.lookAt(boss.position.x,1.3,boss.position.z);
 renderer.render(scene,camera);
}
animate();

addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
